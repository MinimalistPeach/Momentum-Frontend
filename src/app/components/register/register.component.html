<form (ngSubmit)="onSubmit()">
  <h2>Register</h2>

  <div class="form-group">
    <label for="email">Username:</label>
    <input id="username" type="text" [(ngModel)]="username" name="username" placeholder="Enter your username"
      required />
  </div>

  <div class="form-group">
    <label for="password">Password:</label>
    <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Enter your password"
      required />
  </div>

  <div class="form-group">
    <label for="confirmPassword">Confirm Password:</label>
    <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
      placeholder="Confirm your password" required />
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="success" class="success">{{ success }}</div>

  <button type="submit" class="submit-btn"
    (click)="registerButtonClick.emit({username: username, password: password})">Register</button>
</form>
