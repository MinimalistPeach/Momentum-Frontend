<form (ngSubmit)="onSubmit()">
  <h2>Login</h2>

  <div class="form-group">
    <label for="email">Username:</label>
    <input id="email" type="email" [(ngModel)]="username" name="email" placeholder="Enter your email" required />
  </div>

  <div class="form-group">
    <label for="password">Password:</label>
    <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Enter your password"
      required />
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <button type="submit" class="submit-btn"
    (click)="this.loginButtonPressed.emit({ username: username, password: password})">Login</button>
</form>
