<h2 mat-dialog-title>Új terv felvételéhez kérlek töltsd ki az alábbi mezőket</h2>
<mat-dialog-content>
    <mat-form-field>
        <mat-label>Cím</mat-label>
        <input matInput [(ngModel)]="data.title" />
    </mat-form-field>
    <mat-form-field>
        <mat-label>Leírás</mat-label>
        <input matInput [(ngModel)]="data.description" />
    </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="onNoClick()">Bezárás mentés nélkül</button>
    <button mat-button [mat-dialog-close]="data" cdkFocusInitial>Mentés</button>
</mat-dialog-actions>
