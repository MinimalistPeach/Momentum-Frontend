<div class="plans-page">
  <div class="left">
    <h3>Napi teendők aránya</h3>
    <div class="progress-info">{{completedCount}}/{{totalCount}}</div>
    <div class="progress">
      <div class="progress-inner" [style.width.%]="progressPct"></div>
    </div>
  </div>

  <div class="center">
    <h4>NAPI TEENDŐK</h4>
    <ul class="tasks">
      <li *ngFor="let t of tasks" [class.active]="t === tasks[1]">
        <label>
          <input type="checkbox" [checked]="t.done" (change)="toggle(t)" />
          <span class="task-title">{{t.title}}</span>
        </label>
      </li>
    </ul>
  </div>

  <div class="right">
    <h4>Napi motivációs üzenet</h4>
    <p>Kis lépések nagy hatás — ma is tegyél egy apró lépést!</p>
  </div>
</div>
